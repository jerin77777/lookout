worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    client_max_body_size 100M;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;

    map_hash_bucket_size 128;

    # Map for WebSocket Connection upgrade header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # CORS Origin Mapping
    map $http_origin $cors_origin {
        default "https://appforgestudio.web.app";
        "https://appforgestudio.web.app" "https://appforgestudio.web.app";
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    }

    # Redirect HTTP to HTTPS main (port 443)
    server {
        listen 80;
        server_name appforgestudio.in www.appforgestudio.in;
        return 301 https://$host$request_uri;
    }

    # ====== HTTPS on port 443 → forwards to :1000 ======
    server {
        listen 443 ssl;
        server_name appforgestudio.in;

        ssl_certificate     fullchain.pem;
        ssl_certificate_key privateKey.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:1000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ====== HTTPS on port 9090 → forwards to :5000 (Backend API, Socket.IO & WebSockets) ======
    server {
        listen 9090 ssl;
        server_name appforgestudio.in;

        ssl_certificate fullchain.pem;
        ssl_certificate_key privateKey.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Real-Time WebSockets (/ws/stt, /ws/infer)
        location /ws/ {
            proxy_pass http://127.0.0.1:5000/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Socket.IO Real-time Events
        location /socket.io/ {
            proxy_pass http://127.0.0.1:5000/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /socket-health {
            proxy_pass http://127.0.0.1:5000/health;
        }

        # Static Project Assets (Moved from 6002)
        location ~ ^/projects/.*static/.*$ {
            root C:/Users/Administrator/Music/appforge/backend;
            add_header Access-Control-Allow-Origin *;
        }
    }


    # ====== HTTPS on port 6001 → forwards to :8080 (Emulator) ======
    server {
        listen 6001 ssl;
        server_name appforgestudio.in;

        ssl_certificate     fullchain.pem;
        ssl_certificate_key privateKey.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ====== HTTP on port 8080 → serves the React Native Web app ======
    server {
        listen 8080;
        server_name localhost appforgestudio.in;

        root C:/Users/Administrator/Music/vyom/yoga/dist;

        location ~* \.(glb|gltf|bin|wasm|fbx)$ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range,Content-Type' always;
            add_header 'Cache-Control' 'public, max-age=31536000, immutable' always;
            try_files $uri =404;
        }

        location / {
            index index.html;
            add_header 'Access-Control-Allow-Origin' '*' always;
            try_files $uri $uri/ /index.html;
        }
    }
}